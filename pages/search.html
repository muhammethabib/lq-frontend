<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · LexiQamus</title>
  <link rel="icon" href="../assets/lexiqamus-logo.png">

  <!-- Stylesheets: Bootstrap first, then shared tokens, then this feature -->
  <link rel="stylesheet" href="../vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/search.css">

  <!-- Libraries (local copies in vendor/, same versions as the CDN builds). Deferred so they run after the DOM. -->
  <script src="../vendor/jquery.min.js" defer></script>
  <script src="../vendor/bootstrap.bundle.min.js" defer></script>
  <script src="../vendor/feather.min.js" defer></script>
  <script src="../vendor/stimulus.umd.js" defer></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/controllers/search_controller.js" defer></script>
</head>
<body>

  <nav class="navbar lq-topbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="search.html">
        <img src="../assets/lexiqamus-logo.png" alt="LexiQamus">
      </a>
      <ul class="nav">
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        <li class="nav-item"><a class="nav-link" href="#">User guide</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
        <li class="nav-item admin-only"><a class="nav-link" href="#">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div class="container-fluid p-4 search-surface" data-controller="search" data-search-language-value="latin">

    <div class="search-card p-4 mb-4">
      <form data-action="submit->search#submit">
        <div class="d-flex gap-2 mb-3">
          <button type="button" class="btn btn-outline-secondary btn-sm language-pill"
                  data-language="latin" data-search-target="languagePill"
                  data-action="click->search#selectLanguage">Latin</button>
          <button type="button" class="btn btn-outline-secondary btn-sm language-pill"
                  data-language="ottoman" data-search-target="languagePill"
                  data-action="click->search#selectLanguage">Ottoman</button>
        </div>

        <div class="input-group input-group-lg">
          <input type="text" class="form-control search-input" placeholder="Search a word…"
                 data-search-target="input" data-direction="ltr" aria-label="Search">
          <button type="submit" class="btn search-submit">
            <i data-feather="search"></i>
            <span class="d-none d-sm-inline ms-1">Search</span>
          </button>
        </div>
      </form>
    </div>

    <div class="search-card p-3">
      <!-- table-responsive lets the table scroll inside the card on narrow screens instead of widening the page -->
      <div class="table-responsive">
      <table class="table table-light align-middle result-table d-none" data-search-target="resultsTable">
        <thead>
          <tr>
            <th scope="col">Type</th>
            <th scope="col">Headword</th>
            <th scope="col">Ottoman</th>
            <th scope="col">Definition</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody data-search-target="resultsBody"></tbody>
      </table>
      </div>
      <p class="search-empty-state text-center my-4" data-search-target="emptyState">
        Type a word and press Search.
      </p>
    </div>

    <!-- Empty modal container; content comes from the template below -->
    <div id="searchDetailModal" class="modal fade" tabindex="-1" data-search-target="detailModal"></div>
  </div>

  <template id="searchDetailTemplate">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title detail-headword"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="detail-definition mb-0"></p>
        </div>
        <div class="modal-footer admin-only">
          <button type="button" class="btn btn-outline-danger btn-sm"><i data-feather="trash-2"></i> Delete</button>
          <button type="button" class="btn btn-primary btn-sm"><i data-feather="edit-2"></i> Edit</button>
        </div>
      </div>
    </div>
  </template>

</body>
</html>
